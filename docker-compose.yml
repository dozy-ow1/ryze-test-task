name: ryze

x-worker: &worker
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
    args:
      PKG: worker
  image: ryze-worker
  env_file: .env
  # node is not PID 1, so a SIGKILL to it ends the container the way a crash does and the restart
  # policy brings it back (`docker kill` counts as a manual stop and would not be restarted).
  init: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ryze
      POSTGRES_PASSWORD: ryze
      POSTGRES_DB: ryze
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro # docker compose exec postgres psql -U ryze -d ryze -f /db/schema_test.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryze -d ryze"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" && mc mb --ignore-existing "local/$$S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    <<: *worker
    command: ["node", "dist/scripts/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PKG: api
    image: ryze-api
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker-generate:
    <<: *worker
    command: ["node", "dist/main.js", "--pool=generate"]
    environment:
      POOL: generate
      CONCURRENCY: 8
      LEASE_SECONDS: 120
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      fake-providers:
        condition: service_healthy

  worker-publish:
    <<: *worker
    command: ["node", "dist/main.js", "--pool=publish"]
    environment:
      POOL: publish
      CONCURRENCY: 16
      LEASE_SECONDS: 60
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully

  fake-providers:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PKG: fake-providers
    image: ryze-fake-providers
    env_file: .env
    environment:
      PORT: 8091
    ports:
      - "8091:8091"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30


volumes:
  pgdata:
  miniodata:
