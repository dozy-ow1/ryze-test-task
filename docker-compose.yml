name: ryze

x-worker: &worker
  build:
    context: .
    args:
      PKG: worker
  image: ryze-worker
  env_file: .env
  environment:
    LLM_BASE_URL: ${LLM_BASE_URL:-http://mock-providers:8091}
    IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://mock-providers:8091}
    MOCK_SHOPIFY_URL: ${MOCK_SHOPIFY_URL:-http://mock-shopify:8092}
  # node is not PID 1, so a SIGKILL to it ends the container the way a crash does and the restart
  # policy brings it back (`docker kill` counts as a manual stop and would not be restarted).
  init: true
  stop_grace_period: 130s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ryze
      POSTGRES_PASSWORD: ryze
      POSTGRES_DB: ryze
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryze -d ryze"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" && mc mb --ignore-existing "local/$$S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    <<: *worker
    command: ["node_modules/.bin/ryze-migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      args:
        PKG: api
    image: ryze-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SITE_TOKEN_KEY: ${SITE_TOKEN_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker-generate:
    <<: *worker
    command: ["node", "dist/main.js", "--pool=generate"]
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker-publish:
    <<: *worker
    command: ["node", "dist/main.js", "--pool=publish"]
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  reconciler:
    <<: *worker
    command: ["sh", "-c", "while true; do node dist/reconcile.js; sleep 60; done"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  mock-providers:
    build:
      context: .
      args:
        PKG: mock-providers
    image: ryze-mock-providers
    environment:
      PORT: 8091
    ports:
      - "127.0.0.1:8091:8091"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-shopify:
    build:
      context: .
      args:
        PKG: mock-shopify
    image: ryze-mock-shopify
    environment:
      PORT: 8092
    ports:
      - "127.0.0.1:8092:8092"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8092/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  miniodata:
